<div class="card">
  <!-- <h3>{{ course().title }} ({{ course().code }})</h3> -->
  <h3>
    <a [routerLink]="['/courses', course().id]">
      {{ course().title }}
    </a>
    ({{ course().code }})
  </h3>
  <p>Enrolled {{ course().enrollmentCount }} of {{ course().maxCapacity }} seats</p>
  <span class="badge" [class.closed]="course().enrollmentCount >= course().maxCapacity">
    {{
      course().enrollmentCount >= course().maxCapacity
        ? 'Full'
        : 'Accepting
enrollments'
    }}
  </span>
  <button
    (click)="enrollClicked.emit(course())"
    [disabled]="course().enrollmentCount >= course().maxCapacity"
  >
    Enroll
  </button>
  <button type="button" (click)="deleteClicked.emit(course())">Delete</button>

  <!-- Temporary button for Module 10 lab testing -->
  @if (course().enrollmentCount >= course().maxCapacity) {
    <button (click)="enrollClicked.emit(course())">Test Full-Course Error</button>
  }
</div>
